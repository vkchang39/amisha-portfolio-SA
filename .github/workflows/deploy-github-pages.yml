name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint & smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Single static export for e2e, Lighthouse, and (on main) Pages deploy.
      - name: Build static site
        run: pnpm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
          NEXT_PUBLIC_FORM_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_FORM_ACCESS_KEY }}
          NEXT_PUBLIC_GOATCOUNTER: ${{ vars.NEXT_PUBLIC_GOATCOUNTER }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests (against static export)
        run: pnpm test:e2e
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_BUILD: "true"
          PLAYWRIGHT_BASE_PATH: /amisha-portfolio-SA
          NEXT_PUBLIC_BASE_PATH: /amisha-portfolio-SA

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Lighthouse budgets (desktop)
        run: pnpm lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NEXT_PUBLIC_BASE_PATH: /amisha-portfolio-SA
          PLAYWRIGHT_BASE_PATH: /amisha-portfolio-SA

      - name: Lighthouse budgets (mobile, warn)
        run: pnpm lighthouse:mobile
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NEXT_PUBLIC_BASE_PATH: /amisha-portfolio-SA
          PLAYWRIGHT_BASE_PATH: /amisha-portfolio-SA

      - name: Upload static export
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out
          retention-days: 2

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: site-out
          path: out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
